<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الخدمة متوقفة مؤقتاً</title>
<style>
  :root{
    --bg:#f3f1ec; --ink:#1d2327; --muted:#5b646b; --line:#cfcac0; --accent:#8a2b1f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14181b; --ink:#e9e6df; --muted:#9aa3a9; --line:#2d353a; --accent:#e08a7c; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
    display:grid; place-items:center; padding:24px; line-height:1.9;
  }
  main{max-width:34rem; width:100%; border-inline-start:4px solid var(--accent); padding-inline-start:24px}
  h1{font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 12px; line-height:1.35}
  p{margin:0 0 14px; font-size:1.08rem}
  .muted{color:var(--muted); font-size:.95rem}
  hr{border:0; border-top:1px solid var(--line); margin:22px 0}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>الخدمة متوقفة مؤقتاً</h1>
  <p>هذا الموقع غير متاح حالياً، وذلك لحين تسوية مسألة تتعلق بحقوق البرمجيات المستخدمة فيه.</p>
  <hr>
  <p class="muted">نعتذر عن أي إزعاج.</p>
</main>
</body>
</html>
